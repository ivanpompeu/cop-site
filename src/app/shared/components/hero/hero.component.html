<section class="cop-hero" id="inicio">
  <div class="container text-center">
    <div class="cop-hero-badge mb-4">Software de gestão de obras</div>

    <h1 class="cop-hero-title">
      Controle total <span class="text-cop-blue">dos custos</span> da sua obra
    </h1>

    <p class="cop-hero-subtitle mx-auto">
      Planejamento, mão de obra, materiais e relatórios em um único lugar.
      Para engenheiros, arquitetos e empreiteiros.
    </p>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a [routerLink]="['/']" fragment="planos" class="btn btn-cop-primary btn-lg px-4">
        Assinar agora
      </a>
      <a [routerLink]="['/']" fragment="planos" class="btn btn-cop-outline btn-lg px-4">
        Ver planos
      </a>
    </div>

    <div class="cop-hero-stats d-flex justify-content-center gap-5 mt-5 pt-4">
      <div class="cop-stat">
        <div class="cop-stat-num">+500</div>
        <div class="cop-stat-lbl">Obras gerenciadas</div>
      </div>
      <div class="cop-stat">
        <div class="cop-stat-num">98%</div>
        <div class="cop-stat-lbl">Satisfação</div>
      </div>
      <div class="cop-stat">
        <div class="cop-stat-num">3x</div>
        <div class="cop-stat-lbl">Mais produtividade</div>
      </div>
    </div>
  </div>
</section>
