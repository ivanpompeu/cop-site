<section class="cop-result-page">
  <div class="container text-center">

    <div class="cop-result-icon cop-result-icon--cancel">
      <i class="bi bi-x-circle-fill"></i>
    </div>

    <h1 class="cop-result-title">Pagamento não concluído</h1>

    <p class="cop-result-msg mx-auto">
      Sua assinatura não foi processada. Isso pode ter acontecido porque você cancelou
      o processo ou houve um problema com o pagamento. Nenhum valor foi cobrado.
    </p>

    <a [routerLink]="['/']" fragment="planos" class="btn btn-cop-primary btn-lg px-5 mt-2">
      <i class="bi bi-arrow-left me-2"></i>
      Voltar para os planos
    </a>

    <p class="cop-result-note mt-4">
      Se precisar de ajuda, entre em contato conosco em
      <a href="mailto:contato@custoobrapro.com.br">contato&#64;custoobrapro.com.br</a>
    </p>

  </div>
</section>
