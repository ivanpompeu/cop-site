<section class="cop-result-page">
  <div class="container text-center">

    <div class="cop-result-icon cop-result-icon--success">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h1 class="cop-result-title">Assinatura confirmada!</h1>

    <p class="cop-result-msg mx-auto">
      Seu pagamento foi processado com sucesso. Sua conta está ativa e pronta para uso.
      Acesse o sistema agora e comece a gerenciar suas obras.
    </p>

    <a [href]="copAppUrl" class="btn btn-cop-primary btn-lg px-5 mt-2">
      <i class="bi bi-box-arrow-in-right me-2"></i>
      Acessar o sistema
    </a>

    <p class="cop-result-note mt-4">
      Você também receberá um e-mail de confirmação com os detalhes da sua assinatura.
    </p>

  </div>
</section>
